name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run delayed jobs as well; never gate collection on the runner's wall-clock hour.
    - cron: "0 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the digest after collection
        type: boolean
        default: false
      dry_run:
        description: Print a digest preview to the workflow log (never sends email)
        type: boolean
        default: false
      initial_backfill:
        description: Include up to 25 items on an empty delivery state (default is 12)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect and filter security advisories
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CVE_WATCHLIST_JSON: ${{ secrets.CVE_WATCHLIST_JSON }}
          CVE_STATE_REPOSITORY: ${{ secrets.CVE_STATE_REPOSITORY }}
          CVE_STATE_TOKEN: ${{ secrets.CVE_STATE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CVE_EMAIL_FROM: ${{ secrets.CVE_EMAIL_FROM }}
          CVE_EMAIL_TO: ${{ secrets.CVE_EMAIL_TO }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SEND: ${{ inputs.send_email }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_BACKFILL: ${{ inputs.initial_backfill }}
        run: |
          flags=()
          if [[ "$EVENT_NAME" == "schedule" || "$INPUT_SEND" == "true" ]]; then
            if [[ -n "$RESEND_API_KEY" && -n "$CVE_EMAIL_FROM" && -n "$CVE_EMAIL_TO" && -n "$CVE_STATE_REPOSITORY" && -n "$CVE_STATE_TOKEN" ]]; then
              flags+=(--send)
            else
              echo "::warning::Email delivery is disabled because Resend or private delivery-state secrets are missing. Collection and deployment will continue."
            fi
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then flags+=(--dry-run); fi
          if [[ "$INPUT_BACKFILL" == "true" ]]; then flags+=(--backfill); fi
          npm run cve:collect -- "${flags[@]}"

      - name: Report monitoring failure
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::Monitoring did not complete successfully. Deploying available static data; check collector logs for source or email errors."

      - name: Build static Next.js site
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
